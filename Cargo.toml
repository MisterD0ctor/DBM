[workspace]
members = ["crates/*"]
resolver = "3"

# One player, in crates by layer: each may use only the ones below it, and
# the compiler holds them to it. `crates/player/src/main.rs` has the map.
[workspace.package]
# The product's version line continues from the Tauri build, which released
# 0.2.0. This is the same player to anyone installing it, and a version that
# went backwards would be a lie to the installer and to anyone updating.
version = "1.2.0"
edition = "2024"
# The newest thing it uses is `<[T]>::as_chunks`, in the OpenSubtitles hash.
rust-version = "1.88"
# The toolkit and the bundled libmpv both require it; see THIRD-PARTY.md.
license = "GPL-3.0-or-later"
repository = "https://github.com/MisterD0ctor/DBM"
publish = false

# Every version in one place, so no two crates build different ones. Why each
# is used is said where it is.
[workspace.dependencies]
dbm-gpu = { path = "crates/gpu" }
dbm-lang = { path = "crates/lang" }
dbm-library = { path = "crates/library" }
dbm-mpv = { path = "crates/mpv" }
dbm-naming = { path = "crates/naming" }

base64 = "0.22"
glow = "0.16"
libc = "0.2"
libloading = "0.8"
log = "0.4"
md-5 = "0.11"
raw-window-handle = "0.6"
resvg = { version = "0.47", default-features = false }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.18"
slint-build = "1.18"
sys-locale = "0.3"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["json"] }
url = "2"
windows = "0.61"
winresource = "0.1"
zbus = "5"
zeroize = "1"

# Pedantic and nursery as a whole are mostly noise here; these are the lints
# from them that catch something real. CI denies every warning, so a lint on
# this list is one the code already passes.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
cast_lossless = "warn"
manual_midpoint = "warn"
match_same_arms = "warn"
needless_pass_by_ref_mut = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
use_self = "warn"
