[package]
name = "dbm-mpv"
description = "The libmpv binding DBM plays through"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# libmpv is opened at run time rather than linked; see `lib.rs`.
libloading.workspace = true
log.workspace = true
# Reading the track list, the chapters and the playlist, which mpv prints as
# JSON — see `tracks`. The library already builds both.
serde.workspace = true
serde_json.workspace = true
# Error types without hand-written `Display` impls. Slint already builds it.
thiserror.workspace = true

[features]
# `MediaPath::for_test`, a path made from any text, for the other crates'
# tests. Never in a build: everywhere else a path is made from a real one.
testing = []

[lints]
workspace = true
