[package]
name = "dbm-player"
description = "A video player built on mpv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The winit window behind Slint's is reached for what Slint has no say in: the
# window's floor once the interface's size has changed it, the display's size
# that sizes are offered up to, and, everywhere but Windows, hiding the
# pointer and minimizing. The winit backend is already the default, so the
# feature only widens what is reachable.
slint = { workspace = true, features = ["raw-window-handle-06", "unstable-winit-030"] }
glow.workspace = true
libloading.workspace = true
raw-window-handle.workspace = true
rfd.workspace = true
# The small JSON caches of what is known about each file — see
# `library::cache` — and the MD5 mpv names its watch-later files by. `serde`
# is named only for its traits; `serde_json` already brings it.
serde.workspace = true
serde_json.workspace = true
md-5.workspace = true
# Signing in to OpenSubtitles — see `opensubtitles::account`: overwriting the
# password and the token wherever the player holds them, reading a token's
# expiry, and checking every address a request goes to. TLS and the HTTP
# client already build all three, so this adds no crate to the build.
zeroize.workspace = true
base64.workspace = true
url.workspace = true
dbm-lang.workspace = true
# Draws the logo into the light behind an empty window — see `mark`. Slint
# already renders its SVG icons with it, so this adds no crate to the build.
resvg.workspace = true
# The player's own lines, to stderr and to a file — see `logging`. Slint and
# zbus already build it, so this adds no crate to the build.
log.workspace = true
# Error types without hand-written `Display` impls. Slint already builds it.
thiserror.workspace = true

[target.'cfg(not(windows))'.dependencies]
# Talking to OpenSubtitles — see `opensubtitles`. Blocking, which is what a
# thread of its own wants. TLS through rustls with Mozilla's roots compiled
# in, so a Flatpak with no host certificates reaches it the same as anything
# else; on Windows the system's own TLS instead, below.
ureq = { workspace = true, features = ["tls"] }
# The media keys and the desktop's media widget, which here means MPRIS over
# D-Bus - see `mpris`. Default features: that is the blocking API over
# `async-io`, so nothing drags in an async runtime the rest of the player
# would then have to live with.
zbus.workspace = true
# Starting the seek preview's ffmpeg below the player's priority - see
# `ffmpeg::spawn_behind`. winit and zbus already build it.
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# The same client, over Windows' own TLS: rustls's cryptography is C that a
# Windows build would need a C compiler for, and Windows has TLS already.
ureq = { workspace = true, features = ["native-tls"] }
native-tls.workspace = true
windows = { workspace = true, features = [
    # The media overlay and the transport buttons on a headset — see `smtc`.
    "Media",
    "Foundation",
    "Win32_System_WinRT_Media",
    # Reading the overlay back and asking it for a button, for `DBM_SMTC_TEST`.
    "Media_Control",
    "Win32_Foundation",
    # Taking over the window's drop target — see `dropped`.
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # Keeping the display on while something plays — see `awake`.
    "Win32_System_Power",
    # Asking for Windows 11's round corners — see `platform::window`.
    "Win32_Graphics_Dwm",
] }

[build-dependencies]
slint-build.workspace = true

# The executable's own icon and version block — see `build.rs`.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[lints]
workspace = true
