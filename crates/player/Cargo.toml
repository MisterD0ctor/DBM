[package]
name = "dbm-player"
description = "A video player built on mpv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The winit window behind Slint's is reached for what Slint has no say in: the
# window's floor once the interface's size has changed it, the display's size
# that sizes are offered up to, and, everywhere but Windows, hiding the
# pointer and minimizing. The winit backend is already the default, so the
# feature only widens what is reachable.
slint = { workspace = true, features = ["raw-window-handle-06", "unstable-winit-030"] }
glow.workspace = true
raw-window-handle.workspace = true
rfd.workspace = true
# Reading mpv's list of audio devices, which it hands over as JSON — see
# `playback::audio`.
serde_json.workspace = true
# Overwriting the OpenSubtitles password once it has been handed on — see
# `interface::actions`.
zeroize.workspace = true
dbm-gpu.workspace = true
dbm-lang.workspace = true
dbm-library.workspace = true
dbm-mpv.workspace = true
dbm-naming.workspace = true
# The player's own lines, to stderr and to a file — see `logging`. Slint and
# zbus already build it, so this adds no crate to the build.
log.workspace = true

[target.'cfg(not(windows))'.dependencies]
# The media keys and the desktop's media widget, which here means MPRIS over
# D-Bus - see `mpris`. Default features: that is the blocking API over
# `async-io`, so nothing drags in an async runtime the rest of the player
# would then have to live with.
zbus.workspace = true
# Handing freed memory back — see `platform::memory` — and the frame log's
# clock. winit and zbus already build it.
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    # The media overlay and the transport buttons on a headset — see `smtc`.
    "Media",
    "Foundation",
    "Win32_System_WinRT_Media",
    # Reading the overlay back and asking it for a button, for `DBM_SMTC_TEST`.
    "Media_Control",
    "Win32_Foundation",
    # Taking over the window's drop target — see `dropped`.
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # Keeping the display on while something plays — see `awake`.
    "Win32_System_Power",
    # Asking for Windows 11's round corners — see `platform::window`.
    "Win32_Graphics_Dwm",
] }

[build-dependencies]
slint-build.workspace = true

# The executable's own icon and version block — see `build.rs`.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[lints]
workspace = true
