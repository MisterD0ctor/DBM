name: Build

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  # The bundled binaries (libmpv-2.dll, libmpv-wrapper.dll,
                  # ffmpeg-x86_64-pc-windows-msvc.exe) are tracked in Git LFS.
                  lfs: true

            - name: Install Rust stable (host + wasm32)
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            # Workspace root holds the Leptos frontend + the shared crate;
            # src-tauri is also a member but Cargo writes everything into the
            # top-level `target/` so a single cache key covers both.
            - name: Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: .

            - name: Install Trunk (frontend bundler)
              uses: jetli/trunk-action@v0.5.0
              with:
                  version: latest

            # Drives `tauri build`, which runs the `beforeBuildCommand`
            # (`trunk build`), compiles the Rust binary, and bundles the
            # configured installer targets — on Windows that's NSIS + MSI per
            # `bundle.targets: "all"` in tauri.conf.json.
            #
            # On a `v*` tag push, also creates/updates a GitHub Release and
            # uploads the installers to it.
            - name: Tauri build
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
                  releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
                  releaseDraft: true
                  prerelease: false

            - name: Upload installer artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: death-by-mpv-windows-installers
                  path: |
                      target/release/bundle/nsis/*.exe
                      target/release/bundle/msi/*.msi
                  if-no-files-found: error
