name: Build

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

# Opt into Node.js 24 for JavaScript-based actions ahead of the June 2026
# default flip. actions/checkout@v4 and actions/upload-artifact@v4 are still
# bundled with the Node 20 runtime today; this flag tells the runner to
# execute them on Node 24 instead and silences the deprecation warning until
# each action ships a v5.
env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    # The Linux side, which is also what the Flatpak builds: formatting, the
    # lints, and the tests. Nothing is packaged here — that is the Flatpak
    # job's.
    linux:
        name: Linux
        runs-on: ubuntu-latest

        steps:
            # No LFS: the vendored binaries are Windows ones, and nothing on
            # this side reads them.
            - uses: actions/checkout@v4

            # What `cargo build` links against on Linux — see Building from
            # source in the README.
            - name: Install system libraries
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                      libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
                      libwayland-dev libgl-dev

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: .

            # DESIGN.md's front matter and .impeccable/design.json are made
            # from the code, so a token changed without rerunning
            # `scripts/design.py write` fails here rather than drifting.
            - name: Design files
              run: python3 scripts/design.py check

            - name: Format
              run: cargo fmt --check

            # Warnings fail the build: a lint let through once is a lint
            # nobody reads again.
            - name: Lint
              run: cargo clippy -p dbm-player --all-targets -- -D warnings

            - name: Test
              run: cargo test -p dbm-player

    build:
        name: Windows
        runs-on: windows-latest
        # The OpenSubtitles key the shipped player identifies itself with (see
        # crates/player/keys/). Set for the whole job, so lint, build and test
        # all compile the same crate and none of them redoes another's work.
        # A pull request from a fork gets no secrets, and its build simply has
        # no search.
        env:
            DBM_OPENSUBTITLES_KEY: ${{ secrets.OPENSUBTITLES }}

        steps:
            - uses: actions/checkout@v4
              with:
                  # The two vendored binaries under crates/player/vendor/ —
                  # libmpv-2.dll and ffmpeg-x86_64-pc-windows-msvc.exe — are
                  # tracked in Git LFS, and the build needs the real files
                  # rather than the pointers.
                  lfs: true

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy

            - name: Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: .

            # The Windows-only code — the drop target, the modal-loop hook,
            # SMTC, the wake lock — is linted nowhere else. Formatting is
            # checked once, on the Linux side.
            - name: Lint
              run: cargo clippy -p dbm-player --all-targets -- -D warnings

            - name: Build
              run: cargo build --release -p dbm-player

            - name: Test
              run: cargo test --release -p dbm-player

            # The version lives in crates/player/Cargo.toml and nowhere else.
            # A tag that disagrees with it would ship an installer whose name
            # and whose contents claim different versions, so it stops here
            # rather than at the point somebody notices.
            - name: Check the tag against the crate version
              if: startsWith(github.ref, 'refs/tags/v')
              shell: pwsh
              run: |
                  $manifest = Get-Content crates/player/Cargo.toml -Raw
                  $null = $manifest -match '(?m)^version\s*=\s*"([^"]+)"'
                  $crate = $Matches[1]
                  $tag = $env:GITHUB_REF_NAME -replace '^v', ''
                  if ($crate -ne $tag) {
                      throw "tag $tag does not match crate version $crate"
                  }

            # Stages the payload — the executable with libmpv and ffmpeg
            # beside it, the layout the player's own lookup expects — and
            # wraps it in the NSIS installer. Both are in packaging/.
            - name: Package
              shell: pwsh
              run: |
                  if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
                      choco install nsis -y --no-progress
                      $env:PATH = "$env:PATH;${env:ProgramFiles(x86)}\NSIS"
                  }
                  ./packaging/build-installer.ps1 -SkipBuild

            # The same directory as a zip, for anyone who would rather not
            # install anything: unpack it anywhere and run the exe.
            - name: Portable zip
              shell: pwsh
              run: |
                  $manifest = Get-Content crates/player/Cargo.toml -Raw
                  $null = $manifest -match '(?m)^version\s*=\s*"([^"]+)"'
                  $version = $Matches[1]
                  Compress-Archive -Path target/package/* `
                      -DestinationPath "target/installer/death-by-mpv-$version-portable.zip"

            - name: Upload build
              uses: actions/upload-artifact@v4
              with:
                  name: death-by-mpv-windows
                  path: target/installer/*
                  if-no-files-found: error

    # The same manifest packaging/flatpak/build.sh builds, inside Flathub's
    # image of the SDK. The libraries before the player are cached under the
    # manifest's hash, so only a changed manifest builds them again.
    flatpak:
        name: Flatpak
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
            # flatpak-builder sandboxes every build with bubblewrap, which
            # needs namespaces a container isn't given by default.
            options: --privileged

        steps:
            - uses: actions/checkout@v4

            # The key the Windows build gets, as the file build.rs also reads:
            # flatpak-builder passes none of the runner's environment into
            # its sandbox. A fork's pull request has none, and builds without
            # search.
            - name: Key
              env:
                  DBM_OPENSUBTITLES_KEY: ${{ secrets.OPENSUBTITLES }}
              run: |
                  if [ -n "$DBM_OPENSUBTITLES_KEY" ]; then
                      printf '%s' "$DBM_OPENSUBTITLES_KEY" > crates/player/keys/opensubtitles
                  fi

            # Software centres show the metainfo's newest release as the
            # version, so a tag it doesn't list would ship a Flatpak calling
            # itself the release before.
            - name: Check the tag against the metainfo
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  newest=$(grep -o -m1 '<release version="[^"]*"' \
                      packaging/flatpak/io.github.MisterD0ctor.DBM.metainfo.xml | cut -d'"' -f2)
                  if [ "$newest" != "${GITHUB_REF_NAME#v}" ]; then
                      echo "tag ${GITHUB_REF_NAME#v} is not the metainfo's newest release, $newest" >&2
                      exit 1
                  fi

            # Its folders go under target/, which the manifest leaves out of
            # the checkout it copies in, so the cache isn't copied into the
            # build.
            - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
              with:
                  manifest-path: packaging/flatpak/io.github.MisterD0ctor.DBM.yml
                  bundle: death-by-mpv.flatpak
                  artifact-name: death-by-mpv-linux
                  build-dir: target/flatpak/build
                  repo-dir: target/flatpak/repo
                  state-dir: target/flatpak/state

    # A tag's release, with what both platforms built, and only once
    # everything has passed: the Flatpak ships what the Linux job tests.
    release:
        name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        needs: [linux, build, flatpak]
        runs-on: ubuntu-latest

        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: release
                  merge-multiple: true

            # Draft, so the release notes are written before anyone sees it.
            - name: Publish release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "$GITHUB_REF_NAME" release/* \
                      --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --draft
