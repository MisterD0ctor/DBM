name: Nightly

# The harness exercises, once a night and whenever asked for, on top of the
# same run every push makes (see smoke.yml). The nightly one is the backstop
# for a machine that passed at the time and drifts: a newer libmpv, a runner
# image that changed under it.
on:
    schedule:
        - cron: "17 3 * * *"
    workflow_dispatch:

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    # The exercises themselves live in smoke.yml, which every push and pull
    # request runs too: one copy of the setup, so the two cannot drift.
    smoke:
        uses: ./.github/workflows/smoke.yml
