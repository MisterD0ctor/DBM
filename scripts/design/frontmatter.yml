name: DBM
description: A video player whose interface is panes of real glass laid over the film.
colors:
  lit: "{{ Paint.lit }}"
  strong: "{{ Paint.strong }}"
  body: "{{ Paint.body }}"
  quiet: "{{ Paint.quiet }}"
  dim: "{{ Paint.dim }}"
  played: "{{ Paint.played }}"
  fill: "{{ Paint.fill }}"
  rail: "{{ Paint.rail }}"
  knob: "{{ Paint.knob }}"
  well: "{{ Paint.well }}"
  ground: "{{ Paint.ground }}"
  wash-ring: "{{ Paint.wash-ring }}"
  wash-strong: "{{ Paint.wash-strong }}"
  wash-button: "{{ Paint.wash-button }}"
  wash-soft: "{{ Paint.wash-soft }}"
  on-ring: "{{ Paint.on-ring@then }}"
  on-ring-rail: "{{ Paint.on-ring-rail@then }}"
  on-ring-wash: "{{ Paint.on-ring-wash@then }}"
  on-ring-knob: "{{ Paint.on-ring-knob@then }}"
typography:
  title:
    fontFamily: "{{ Type.face }}"
    fontSize: "{{ Type.title }}"
    fontWeight: {{ Type.weight-title }}
  body:
    fontFamily: "{{ Type.face }}"
    fontSize: "{{ Type.body }}"
    fontWeight: {{ Type.weight-plain }}
  named:
    fontFamily: "{{ Type.face }}"
    fontSize: "{{ Type.named }}"
    fontWeight: {{ Type.weight-plain }}
  readout:
    fontFamily: "{{ Type.face }}"
    fontSize: "{{ Type.readout }}"
    fontWeight: {{ Type.weight-plain }}
  hint:
    fontFamily: "{{ Type.face }}"
    fontSize: "{{ Type.hint }}"
    fontWeight: {{ Type.weight-plain }}
  timecode:
    fontFamily: "{{ Type.numerals }}"
    fontSize: "{{ Type.readout }}"
    fontWeight: {{ Type.weight-plain }}
  label:
    fontFamily: "{{ Type.face }}"
    fontSize: "{{ Type.label }}"
    fontWeight: {{ Type.weight-plain }}
    letterSpacing: "{{ Type.label-track }}"
  glyph:
    fontFamily: "{{ Type.face }}"
    fontSize: "{{ Type.glyph }}"
    fontWeight: {{ Type.weight-plain }}
  prompt:
    fontFamily: "{{ Type.face }}"
    fontSize: "{{ Type.prompt }}"
    fontWeight: {{ Type.weight-title }}
rounded:
  row: "{{ Rows.radius }}"
  panel: "{{ Rows.panel-radius }}"
  pill: "{{ Bar.pill-radius }}"
  button: "{{ Bar.btn / 2 }}"
  preview: "{{ SeekPreview.radius }}"
  preview-tile: "{{ SeekPreview.tile-radius }}"
  window: "{{ window.CORNER_RADIUS }}px"
spacing:
  hair: "{{ Bar.pill-pad }}"
  tight: "{{ Bar.btn-gap }}"
  group: "{{ Rows.group-gap }}"
  offset: "{{ Rows.offset }}"
  gap: "{{ Rows.gap }}"
  margin: "{{ Surfaces.margin }}"
  trail-x: "{{ Rows.trail-x }}"
  label-x: "{{ Rows.label-x }}"
components:
  icon-button:
    size: "{{ Bar.btn }}"
    rounded: "{rounded.button}"
    textColor: "{colors.lit}"
    backgroundColor: "transparent"
  icon-button-hover:
    backgroundColor: "{colors.wash-button}"
  icon-button-open:
    backgroundColor: "{colors.wash-strong}"
  icon-button-focus:
    backgroundColor: "{colors.wash-ring}"
  icon-button-disabled:
    textColor: "{colors.dim}"
  bar:
    height: "{{ Bar.height }}"
    rounded: "{rounded.panel}"
    padding: "{{ Bar.pad }}"
    backgroundColor: "transparent"
  button-row:
    height: "{{ Bar.pill-h }}"
    padding: "{{ Bar.pill-pad }}"
  window-buttons:
    height: "{{ WindowButtons.pane-h }}"
    rounded: "{{ WindowButtons.pane-h / 2 }}"
    padding: "{{ WindowButtons.pad }}"
    backgroundColor: "transparent"
  window-button:
    size: "{{ WindowButtons.btn }}"
    rounded: "{{ WindowButtons.btn / 2 }}"
    textColor: "{colors.lit}"
    backgroundColor: "transparent"
  window-button-hover:
    backgroundColor: "{colors.wash-button}"
  timeline-row:
    height: "{{ Bar.timeline-h }}"
    textColor: "{colors.strong}"
    typography: "{typography.timecode}"
  timeline-time:
    padding: "0 {{ Bar.glyph-inset }}"
    textColor: "{colors.strong}"
    typography: "{typography.timecode}"
  menu-row:
    height: "{{ Rows.row }}"
    padding: "0 {{ Rows.trail-x }} 0 {{ Rows.label-x }}"
    textColor: "{colors.body}"
    typography: "{typography.body}"
    backgroundColor: "transparent"
  menu-row-hover:
    backgroundColor: "{colors.wash-soft}"
    rounded: "{rounded.row}"
  menu-row-focus:
    backgroundColor: "{colors.wash-ring}"
    rounded: "{rounded.row}"
  menu-row-active:
    textColor: "{colors.lit}"
  section-label:
    height: "{{ Rows.heading }}"
    padding: "0 {{ Rows.trail-x }} 0 {{ Rows.label-x }}"
    textColor: "{colors.body}"
    typography: "{typography.label}"
  section-label-named:
    height: "{{ Rows.heading }}"
    padding: "0 {{ Rows.trail-x }} 0 {{ Rows.label-x }}"
    textColor: "{colors.body}"
    typography: "{typography.named}"
  slider-row:
    height: "{{ Rows.slider-row }}"
    padding: "0 {{ Rows.trail-x }} 0 {{ Rows.label-x }}"
    textColor: "{colors.body}"
    typography: "{typography.readout}"
  stepper-button:
    size: "{{ StepButton.width }}"
    rounded: "{{ StepButton.width / 2 }}"
    backgroundColor: "{colors.wash-button}"
    textColor: "{colors.strong}"
  stepper-button-hover:
    backgroundColor: "{colors.wash-strong}"
  toggle-track-on:
    width: "{{ ToggleRow.toggle.width }}"
    height: "{{ ToggleRow.track.height }}"
    rounded: "{{ ToggleRow.track.height / 2 }}"
    backgroundColor: "{colors.fill}"
  toggle-track-off:
    width: "{{ ToggleRow.toggle.width }}"
    height: "{{ ToggleRow.track.height }}"
    rounded: "{{ ToggleRow.track.height / 2 }}"
    backgroundColor: "{colors.rail}"
  hover-label:
    height: "{{ HoverTip.tip-h }}"
    rounded: "{{ HoverTip.tip-h / 2 }}"
    padding: "0 {{ HoverTip.pad }}"
    textColor: "{colors.body}"
    typography: "{typography.body}"
  end-pill:
    height: "{{ EndPill.pill-h }}"
    rounded: "{rounded.pill}"
    padding: "0 {{ EndPill.pad }}"
    textColor: "{colors.lit}"
    typography: "{typography.prompt}"
  end-pill-hover:
    backgroundColor: "{colors.wash-button}"
  end-choice:
    height: "{{ EndPill.pill-h - 2 * Bar.pill-pad }}"
    rounded: "{{ (EndPill.pill-h - 2 * Bar.pill-pad) / 2 }}"
    padding: "0 {{ EndPill.pad - Bar.pill-pad }}"
    textColor: "{colors.lit}"
    typography: "{typography.prompt}"
  resume-row:
    height: "{{ Rows.row }}"
    padding: "0 {{ Rows.trail-x }} 0 {{ Rows.label-x }}"
    textColor: "{colors.strong}"
    typography: "{typography.body}"
  seek-preview:
    rounded: "{rounded.preview}"
    padding: "{{ SeekPreview.pad }}"
    textColor: "{colors.strong}"
    typography: "{typography.timecode}"
